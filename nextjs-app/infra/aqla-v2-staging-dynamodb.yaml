AWSTemplateFormatVersion: '2010-09-09'
Description: AQla v2 staging DynamoDB table for user plans and follow-up state

Resources:
  AqlaV2StagingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aqla-v2-staging
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: AQla
        - Key: Environment
          Value: staging

Outputs:
  TableName:
    Value: !Ref AqlaV2StagingTable
  TableArn:
    Value: !GetAtt AqlaV2StagingTable.Arn
